{{ define "body" }}
<main class="home" id="content">
	{{ range .Any }}
	<section id="{{ .Name }}">
		<div class="intro">
			<h2>{{ .Name }}</h2>
			<p>{{ .Description }}</p>
		</div>
		<article>
			{{ range .Articles }}
			<a href="{{ .URI }}">
				<article>
					<h3>{{ .Title }}</h3>
					<p>{{ .Description }}</p>
				</article>
			</a>
			{{ end }}
		</article>
	</section>
	{{end}}
</main>
{{ end }}
